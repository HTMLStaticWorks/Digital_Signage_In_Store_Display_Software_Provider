<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Log in to DisplayFlow Digital Signage & Screen Network Platform.">
  <link rel="icon" href="assets/images/favicon.png">
  <title>Log-in | DisplayFlow Signage</title>
  <link rel="stylesheet" href="assets/style.css">
</head>

<body class="auth-page">

  <!-- Top-Right Floating Controls -->
  <div class="auth-top-corner">
    <button class="toolbtn" id="rtl-toggle" aria-label="Toggle LTR/RTL">RTL</button>
    <button class="toolbtn" id="theme-toggle" aria-label="Toggle Dark/Light Mode">☾</button>
  </div>

  <!-- Centered Auth Card View -->
  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="logo"><img src="assets/images/favicon.png" alt="DisplayFlow Logo"
          class="logo-icon">Display<b>Flow</b></a>
      <h1>Welcome back</h1>
      <p>Sign in to manage your display network & playlists</p>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="login-email">Work Email</label>
        <div class="input-group">
          <input type="email" id="login-email" required placeholder="you@company.com" autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label for="login-password">Password</label>
        <div class="input-group">
          <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle-password" data-target="login-password"
            aria-label="Toggle Password Visibility">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
            </svg>
          </button>
        </div>
      </div>

      <div class="form-meta">
        <label class="checkbox-label">
          <input type="checkbox" id="remember-me" checked>
          <span>Remember me for 30 days</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="padding:13px; font-size:14px;">Sign in to Dashboard
        →</button>
    </form>

    <div class="divider">
      <span>Or continue with</span>
    </div>

    <div class="social-auth-grid">
      <button type="button" class="social-btn">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
        </svg>
        <span>Google</span>
      </button>

      <button type="button" class="social-btn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.13-1.96.99-3.12-1 .04-2.19.67-2.88 1.48-.61.72-1.14 1.88-.99 3.01 1.11.09 2.22-.55 2.88-1.37z" />
        </svg>
        <span>Apple</span>
      </button>
    </div>

    <div class="auth-footer">
      Don't have a DisplayFlow account? <a href="signup.html">Create Account</a>
    </div>
  </div>

  <script src="assets/main.js"></script>
</body>

</html>
